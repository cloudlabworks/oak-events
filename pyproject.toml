[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oak-events"
version = "0.1.1"
description = "Privacy-first events from Luxonis OAK cameras for AI agents: JSON lines and an MCP server, never pictures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "oak-events contributors" }]
keywords = ["luxonis", "oak", "depthai", "mcp", "privacy", "events", "agents", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Home Automation",
]
dependencies = ["numpy"]

[project.optional-dependencies]
camera = ["depthai>=3.9"]
mcp = ["mcp>=1.0"]

[project.scripts]
oak-events = "oak_events.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# pycodestyle errors/warnings + pyflakes; CI fails on any finding (OpenSSF Best Practices: warnings).
select = ["E", "F", "W"]
