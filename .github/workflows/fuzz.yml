name: fuzz

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  atheris:
    name: atheris (zones and event files, 60 s)
    # atheris publishes Linux x86_64 wheels only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --require-hashes -r requirements/fuzz.txt
      - name: Fuzz
        env:
          PYTHONPATH: src
        run: |
          mkdir -p crashes
          python fuzz/fuzz_events.py -dict=fuzz/events.dict -max_total_time=60 -artifact_prefix=crashes/ fuzz/corpus
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
