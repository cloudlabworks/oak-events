name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Deliberately without the [camera] extra: tests must pass with no depthai and no camera.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mcp]' pytest
      - name: depthai must be absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('depthai') is not None)"
      - name: Lint (ruff, warnings fail the build)
        run: |
          python -m pip install ruff==0.17.3
          ruff check src tests
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          oak-events --help
          oak-events doctor
