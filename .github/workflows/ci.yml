name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Deliberately without the [camera] extra: tests must pass with no depthai and no camera.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mcp]' pytest
      - name: depthai must be absent
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('depthai') is not None)"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke
        run: |
          oak-events --help
          oak-events doctor
